# Gradle
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# Plugin
pluginGroup=com.example.airefactoring
pluginName=AI Refactoring MVP
pluginVersion=0.1.0
pluginSinceBuild=261
pluginUntilBuild=261.*

# IntelliJ Platform
platformType=IC
platformVersion=2026.1.3

# Toolchain
# javaVersion is the single source of truth for the JDK (build.gradle.kts reads it).
# Set to 21: IntelliJ IDEA 2026.1 runs on the JetBrains Runtime (JBR 21), and
# Kotlin 2.4's jvmTarget tops out at JVM 24 — so JDK 25 bytecode would neither
# compile (jvmTarget ceiling) nor load in the IDE. 21 is the latest usable target.
javaVersion=21
kotlinVersion=2.4.0
