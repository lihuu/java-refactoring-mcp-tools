# Gradle
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
# 空闲 daemon 10 分钟后自动退出，避免工作结束后常驻占内存
org.gradle.daemon.idletimeout=600000

# Plugin
pluginGroup=io.github.lihuu.airefactoring
pluginName=Java Refactoring MCP Tools
pluginVersion=1.0.4.1
pluginSinceBuild=261
# 262 moved BaseExpressionToFieldHandler.Settings' InitializationPlace parameter type to
# JavaIntroduceFieldService$InitializationPlace; the headless settings factory resolves it
# reflectively, so one binary supports both builds. See HeadlessIntroduceMemberSettings.
pluginUntilBuild=262.*

# Exclude bundled Kotlin stdlib to avoid runtime conflicts with IntelliJ Platform
kotlin.stdlib.default.dependency=false

# IntelliJ Platform
platformVersion=2026.1.3

# Toolchain
# javaVersion is the single source of truth for the JDK used to compile (build.gradle.kts reads it).
# Set to 25: the toolchain compiles with JDK 25. The bytecode target stays at Java 21 (see the
# compilerOptions in build.gradle.kts) because IntelliJ IDEA 2026.1 runs on the JetBrains Runtime
# (JBR 21) and Kotlin 2.4's jvmTarget tops out at JVM 24 — so JDK 25 bytecode would neither
# compile (jvmTarget ceiling) nor load in the IDE. 21 remains the only usable bytecode target.
javaVersion=25
kotlinVersion=2.4.0
